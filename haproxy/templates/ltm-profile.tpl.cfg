{{ "{{ end }}" }}


{{ "{{" }} define "profile:/Common/clientssl" {{ "}}" }}
### profile: /Common/clientssl
# Builtin profile: ltm profile client-ssl clientssl in profile_base.conf
# Configures SSL settings for the client (frontend) side. Add option in bind line:
#
#    ssl crt default ssl-min-ver TLSv1.2
#
### /profile: /Common/clientssl
{{ "{{ end }}" }}


### /Builtin profiles
{{ end }}

{{- define "block_profile" }}
{{-   $block := index . "block" }}
{{-   if eq $block.Type "client-ssl" }}
{{-     template "block_clientssl" . }}
{{-   else if eq $block.Type "server-ssl" }}
{{-     template "block_serverssl" . }}
{{-   else if eq $block.Type "http" }}
{{-     template "block_http_profile" . }}
{{-   end }}
{{- end }}

{{- define "block_clientssl" }}
# SSL options (crt, ssl-min-ver, ssl-max-ver, ciphers) applied to bind line above
{{- end }}

{{- define "block_serverssl" }}
{{-   $block := index . "block" }}
{{-   $orig := $block.OriginalConfig.Content }}
{{-   $opts := f5options $orig }}
{{-   $minver := f5tlsMinVer $opts }}
{{-   $maxver := f5tlsMaxVer $opts }}
{{-   $ciphers := f5field $orig "ciphers" }}
{{-   $ciphergroup := f5field $orig "cipher-group" }}
{{-   if or $minver $maxver }}
ssl-default-server-options{{ if $minver }} ssl-min-ver {{ $minver }}{{ end }}{{ if $maxver }} ssl-max-ver {{ $maxver }}{{ end }}
{{-   end }}
{{-   if and $ciphers (ne $ciphers "none") (ne $ciphers "DEFAULT") }}
ssl-default-server-ciphers {{ $ciphers }}
{{-   end }}
{{-   if and $ciphergroup (ne $ciphergroup "none") }}
# cipher-group: {{ $ciphergroup }} (set ssl-default-server-ciphers explicitly if needed)
{{-   end }}
# TODO: add ssl verify required ca-file /path/to/ca.pem (or ssl verify none) to server lines
{{- end }}

{{- define "block_http_profile" }}
{{-   $block := index . "block" }}
{{-   $orig := $block.OriginalConfig.Content }}
{{-   $hsts := f5block $orig "hsts" }}
{{-   if $hsts }}
{{-     $mode := f5field $hsts "mode" }}
{{-     $maxage := f5field $hsts "maximum-age" }}
{{-     $subs := f5field $hsts "include-subdomains" }}
{{-     if eq $mode "enabled" }}
{{-       if eq $subs "enabled" }}
http-response set-header Strict-Transport-Security "max-age={{ $maxage }}; includeSubDomains"
{{-       else }}
http-response set-header Strict-Transport-Security "max-age={{ $maxage }}"
{{-       end }}
{{-     end }}
{{-   end }}
{{- end }}
