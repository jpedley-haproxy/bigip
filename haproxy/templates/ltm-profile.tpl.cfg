### profile: /Common/tcp
# Builtin profile: ltm profile tcp tcp in profile_base.conf
# configures sysctl parameters
### /profile: /Common/tcp
{{ "{{ end }}" }}

{{ "{{" }} define "profile:/Common/http" {{ "}}" }}
### profile: /Common/http
